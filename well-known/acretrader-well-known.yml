    note: Newsroom RSS feed; currently returns an effectively empty channel (569 bytes).
  - url: https://api.acretrader.com/v1/cms/
    status: 200
    content_type: application/json
    note: >-
      Undocumented JSON content endpoint backing the marketing site. AcreTrader publishes
      no reference, no authentication guidance, no terms of use and no machine-readable
