name: Acretrader
description: AcreTrader is a farmland investment marketplace headquartered in Fayetteville, Arkansas that
  lets investors buy fractional, passive ownership stakes in individual US row-crop and permanent-crop
  farms. AcreTrader sources and vets each farm, then handles the legal entity, farm management, and administration
  while investors earn returns from annual cash rent and long-term land appreciation. The company also
  operates Acres, a land data and valuation tool, and serves farmers, advisors, and accredited investors.
  Backed by Anthemis and surfaced into the API Evangelist network as a company profile; AcreTrader publishes
  no public developer API at this time.
