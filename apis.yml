name: Acretrader
description: AcreTrader is a farmland investment platform headquartered in Fayetteville, Arkansas that lets
  accredited investors buy fractional, passive ownership stakes in individual US row-crop, permanent-crop
  and timberland farms. AcreTrader sources and vets each farm, then handles the legal entity, farm management
  and administration while investors earn returns from annual cash rent and long-term land appreciation.
  Securities are offered through North Capital Private Securities Corporation, a FINRA/SIPC member broker-dealer
  that is not an affiliate of the platform. Since 2018 AcreTrader has enabled investment in over 140 farmland
  properties spanning roughly 44,000 acres across 20 states, and its investment management arm, AcreTrader
  Management LLC, reports net IRR of 9.4% to 30.3% on realized deals. Proterra Investment Partners LP acquired
  AcreTrader in August 2025. AcreTrader publishes no public developer API, no developer portal and no
  machine-readable specification; contract discovery was run in full against acretrader.com and
  api.acretrader.com on 2026-08-10 and every discovery path returned 404.
